services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: appealforge-backend
    ports:
      - "8000:8000"
    volumes:
      - backend-data:/app/backend/data
      - backend-config:/app/backend/config
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: appealforge-frontend
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend-data:
  backend-config:
